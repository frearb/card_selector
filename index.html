<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三国杀选将模拟器</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f1e6;
      --ink: #211913;
      --muted: #77695f;
      --line: rgba(65, 44, 27, .18);
      --red: #a92f24;
      --gold: #c68a2f;
      --green: #2f745f;
      --blue: #2f587b;
      --black: #202020;
      --panel: rgba(255, 252, 246, .9);
      --shadow: 0 16px 42px rgba(38, 25, 12, .15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(169, 47, 36, .12), transparent 30%),
        linear-gradient(315deg, rgba(47, 116, 95, .12), transparent 32%),
        var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 16px;
    }

    .topbar {
      display: grid;
      gap: 14px;
      align-items: end;
      padding: 18px 0 12px;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(28px, 8vw, 56px);
      line-height: .95;
      letter-spacing: 0;
    }

    .title p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .controls {
      display: grid;
      gap: 10px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .control-line {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .control-label {
      color: var(--muted);
      font-size: 14px;
    }

    .count-value {
      min-width: 2.5em;
      text-align: right;
      font-weight: 800;
      color: var(--red);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--red);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .primary,
    .secondary {
      min-height: 44px;
      border-radius: 8px;
      font-weight: 800;
    }

    .primary {
      background: var(--red);
      color: white;
    }

    .secondary {
      background: #efe1cf;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .status {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin: 10px 0 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .selected-pill {
      min-height: 30px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(47, 88, 123, .12);
      color: var(--blue);
      font-weight: 800;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }

    .card {
      position: relative;
      overflow: hidden;
      min-height: 455px;
      border-radius: 8px;
      background: #fffaf1;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      transform: translateZ(0);
    }

    .card.selected {
      outline: 4px solid rgba(198, 138, 47, .85);
      outline-offset: -4px;
    }

    .portrait {
      position: relative;
      height: 255px;
      background: linear-gradient(135deg, #352018, #7a3428 45%, #d59a45);
    }

    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: rgba(255, 255, 255, .86);
      text-align: center;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .faction {
      position: absolute;
      left: 10px;
      top: 10px;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: #fff;
      font-weight: 900;
      border: 2px solid rgba(255, 255, 255, .72);
      box-shadow: 0 8px 18px rgba(0, 0, 0, .22);
    }

    .faction.wei { background: var(--blue); }
    .faction.shu { background: var(--red); }
    .faction.wu { background: var(--green); }
    .faction.qun { background: var(--black); }

    .picked-mark {
      position: absolute;
      right: 10px;
      top: 10px;
      min-width: 66px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .94);
      color: var(--red);
      font-size: 13px;
      font-weight: 900;
      opacity: 0;
      transform: translateY(-8px);
      transition: .18s ease;
    }

    .card.selected .picked-mark {
      opacity: 1;
      transform: translateY(0);
    }

    .body {
      padding: 12px;
    }

    .name-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }

    .name {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .skills {
      display: grid;
      gap: 9px;
      margin-top: 10px;
    }

    .skill {
      display: grid;
      gap: 4px;
    }

    .skill-name {
      width: fit-content;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(198, 138, 47, .18);
      color: #71480f;
      font-size: 13px;
      font-weight: 900;
    }

    .skill-text {
      margin: 0;
      color: #3c3028;
      font-size: 14px;
      line-height: 1.55;
    }

    .pick-button {
      width: calc(100% - 24px);
      margin: 0 12px 12px;
      min-height: 42px;
      border-radius: 8px;
      background: #2f587b;
      color: white;
      font-weight: 900;
    }

    .card.selected .pick-button {
      background: var(--gold);
      color: #241405;
    }

    .source {
      margin: 18px 0 0;
      padding: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      background: rgba(255, 252, 246, .65);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .source a {
      color: var(--blue);
    }

    @media (min-width: 760px) {
      .app {
        padding: 26px;
      }

      .topbar {
        grid-template-columns: 1fr 360px;
      }

      .grid {
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="topbar" aria-labelledby="appTitle">
      <div class="title">
        <h1 id="appTitle">三国杀选将</h1>
        <p>随机翻出若干名武将，点击一张完成选定。</p>
      </div>

      <div class="controls" aria-label="选将控制">
        <div class="control-line">

        <input id="cardCount" type="range" min="3" max="10" value="6">
        <div class="actions">

          <button class="secondary" id="clearButton" type="button">取消选择</button>
        </div>
      </div>
    </section>

    <div class="status" aria-live="polite">
      <span id="poolStatus">将池 24 名</span>
      <span class="selected-pill" id="selectedStatus">未选择</span>
    </div>

    <section class="grid" id="cardGrid" aria-label="候选武将"></section>

  </main>

    const grid = document.querySelector("#cardGrid");
    const countInput = document.querySelector("#cardCount");
    const countValue = document.querySelector("#countValue");
    const selectedStatus = document.querySelector("#selectedStatus");
    const poolStatus = document.querySelector("#poolStatus");
    const refreshButton = document.querySelector("#refreshButton");
    const clearButton = document.querySelector("#clearButton");

    let currentHeroes = [];
    let selectedId = null;

    poolStatus.textContent = `将池 ${heroes.length} 名`;

    function shufflePool() {
      return [...heroes].sort(() => crypto.getRandomValues(new Uint32Array(1))[0] / 2 ** 32 - .5);
    }

    function drawHeroes() {
      selectedId = null;
      selectedStatus.textContent = "未选择";
      currentHeroes = shufflePool().slice(0, Number(countInput.value));
      render();
    }

    function selectHero(heroId) {
      selectedId = heroId;
      const hero = heroes.find(item => item.id === heroId);
      selectedStatus.textContent = hero ? `已选择：${hero.name}` : "未选择";
      render();
    }

    function clearSelection() {
      selectedId = null;
      selectedStatus.textContent = "未选择";
      render();
    }

    function render() {
      grid.innerHTML = currentHeroes.map(hero => {
        const isSelected = hero.id === selectedId;
        const skills = hero.skills.map(([name, text]) => `
          <div class="skill">
            <span class="skill-name">${name}</span>
            <p class="skill-text">${text}</p>
          </div>
        `).join("");

        return `
          <article class="card ${isSelected ? "selected" : ""}">
            <div class="portrait">
              <div class="fallback">${hero.name}</div>
              <img src="${hero.image}" alt="${hero.name}武将图" loading="lazy" onerror="this.style.display='none'">
              <span class="faction ${hero.factionClass}">${hero.faction}</span>
              <span class="picked-mark">已选定</span>
            </div>
            <div class="body">
              <div class="name-row">
                <h2 class="name">${hero.name}</h2>
                <span class="meta">${hero.faction}势力 · ${hero.hp}体力</span>
              </div>
              <div class="skills">${skills}</div>
            </div>
            <button class="pick-button" type="button" data-id="${hero.id}">${isSelected ? "当前选择" : "选定此将"}</button>
          </article>
        `;
      }).join("");
    }

    countInput.addEventListener("input", () => {
      countValue.textContent = countInput.value;
    });

    countInput.addEventListener("change", drawHeroes);
    refreshButton.addEventListener("click", drawHeroes);
    clearButton.addEventListener("click", clearSelection);

    grid.addEventListener("click", event => {
      const button = event.target.closest("[data-id]");
      if (!button) return;
      selectHero(Number(button.dataset.id));
    });

    drawHeroes();
  </script>
</body>
</html>
