<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三国杀选将模拟器</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f1e6;
      --ink: #211913;
      --muted: #77695f;
      --line: rgba(65, 44, 27, .18);
      --red: #a92f24;
      --gold: #c68a2f;
      --green: #2f745f;
      --blue: #2f587b;
      --black: #202020;
      --panel: rgba(255, 252, 246, .9);
      --shadow: 0 16px 42px rgba(38, 25, 12, .15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(169, 47, 36, .12), transparent 30%),
        linear-gradient(315deg, rgba(47, 116, 95, .12), transparent 32%),
        var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 16px;
    }

    .topbar {
      display: grid;
      gap: 14px;
      align-items: end;
      padding: 18px 0 12px;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(28px, 8vw, 56px);
      line-height: .95;
      letter-spacing: 0;
    }

    .title p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .controls {
      display: grid;
      gap: 10px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .control-line {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .control-label {
      color: var(--muted);
      font-size: 14px;
    }

    .count-value {
      min-width: 2.5em;
      text-align: right;
      font-weight: 800;
      color: var(--red);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--red);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .primary,
    .secondary,
    .danger {
      min-height: 44px;
      border-radius: 8px;
      font-weight: 800;
    }

    .primary {
      background: var(--red);
      color: white;
    }

    .primary:disabled {
      background: #b7aaa0;
      color: rgba(255, 255, 255, .84);
      cursor: not-allowed;
    }

    .secondary {
      background: #efe1cf;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .danger {
      background: #2f587b;
      color: white;
    }

    .refresh-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .pool-button {
      width: 100%;
      min-height: 42px;
      border-radius: 8px;
      background: rgba(47, 116, 95, .13);
      color: var(--green);
      border: 1px solid rgba(47, 116, 95, .2);
      font-weight: 900;
    }

    .status {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin: 10px 0 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .selected-pill {
      min-height: 30px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(47, 88, 123, .12);
      color: var(--blue);
      font-weight: 800;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }

    .card {
      position: relative;
      overflow: hidden;
      min-height: 455px;
      border-radius: 8px;
      background: #fffaf1;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      transform: translateZ(0);
    }

    .card.selected {
      outline: 4px solid rgba(198, 138, 47, .85);
      outline-offset: -4px;
    }

    .portrait {
      position: relative;
      height: 255px;
      background: linear-gradient(135deg, #352018, #7a3428 45%, #d59a45);
    }

    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .card.selected .portrait {
      height: auto;
      min-height: 0;
      background: #1f1711;
    }

    .card.selected .portrait img {
      height: auto;
      max-height: min(72vh, 820px);
      object-fit: contain;
    }

    .card.selected .fallback {
      display: none;
    }

    .fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: rgba(255, 255, 255, .86);
      text-align: center;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .faction {
      position: absolute;
      left: 10px;
      top: 10px;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: #fff;
      font-weight: 900;
      border: 2px solid rgba(255, 255, 255, .72);
      box-shadow: 0 8px 18px rgba(0, 0, 0, .22);
    }

    .faction.wei { background: var(--blue); }
    .faction.shu { background: var(--red); }
    .faction.wu { background: var(--green); }
    .faction.qun { background: var(--black); }
    .faction.shen { background: linear-gradient(135deg, #5a2f80, #c68a2f); }
    .faction.jin { background: #8a5d6b; }

    .picked-mark {
      position: absolute;
      right: 10px;
      top: 10px;
      min-width: 66px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .94);
      color: var(--red);
      font-size: 13px;
      font-weight: 900;
      opacity: 0;
      transform: translateY(-8px);
      transition: .18s ease;
    }

    .card.selected .picked-mark {
      opacity: 1;
      transform: translateY(0);
    }

    .body {
      padding: 12px;
    }

    .name-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }

    .name {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .skills {
      display: grid;
      gap: 9px;
      margin-top: 10px;
    }

    .skill {
      display: grid;
      gap: 4px;
    }

    .skill-name {
      width: fit-content;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(198, 138, 47, .18);
      color: #71480f;
      font-size: 13px;
      font-weight: 900;
    }

    .skill-text {
      margin: 0;
      color: #3c3028;
      font-size: 14px;
      line-height: 1.55;
    }

    .pick-button {
      width: calc(100% - 24px);
      margin: 0 12px 12px;
      min-height: 42px;
      border-radius: 8px;
      background: #2f587b;
      color: white;
      font-weight: 900;
    }

    .card.selected .pick-button {
      background: var(--gold);
      color: #241405;
    }

    .reroll-button {
      width: calc(100% - 24px);
      margin: 0 12px 8px;
      min-height: 36px;
      border-radius: 8px;
      background: #efe1cf;
      color: var(--ink);
      border: 1px solid var(--line);
      font-size: 13px;
      font-weight: 900;
    }

    .reroll-button:disabled {
      color: var(--muted);
      background: rgba(239, 225, 207, .56);
      cursor: not-allowed;
    }

    .skin-button {
      width: calc(100% - 24px);
      margin: 0 12px 8px;
      min-height: 36px;
      border-radius: 8px;
      background: rgba(47, 116, 95, .13);
      color: var(--green);
      border: 1px solid rgba(47, 116, 95, .2);
      font-size: 13px;
      font-weight: 900;
    }

    .source {
      margin: 18px 0 0;
      padding: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      background: rgba(255, 252, 246, .65);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .source a {
      color: var(--blue);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      background: rgba(28, 18, 10, .55);
      padding: 14px;
    }

    .modal.open {
      display: grid;
      place-items: center;
    }

    .modal-panel {
      width: min(960px, 100%);
      max-height: min(820px, 92vh);
      display: grid;
      grid-template-rows: auto auto auto 1fr;
      gap: 12px;
      padding: 14px;
      background: #fffaf1;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 22px;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: #efe1cf;
      color: var(--ink);
      border: 1px solid var(--line);
      font-size: 24px;
      line-height: 1;
    }

    .pool-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .pool-tab {
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(47, 88, 123, .1);
      color: var(--blue);
      white-space: nowrap;
      font-weight: 800;
    }

    .pool-tab.active {
      background: var(--blue);
      color: white;
    }

    .pool-tools {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .pool-search {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(255, 252, 246, .92);
      color: var(--ink);
      outline: none;
    }

    .pool-search:focus {
      border-color: rgba(47, 88, 123, .58);
      box-shadow: 0 0 0 3px rgba(47, 88, 123, .12);
    }

    .pool-result-count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .pool-list {
      overflow: auto;
      display: grid;
      grid-template-columns: 1fr;
      align-content: start;
      gap: 8px;
      padding-right: 2px;
    }

    .pool-item {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: start;
      gap: 8px;
      min-height: 58px;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 252, 246, .88);
      text-align: left;
      cursor: pointer;
      font: inherit;
      color: inherit;
    }

    .pool-empty {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
      background: rgba(255, 252, 246, .72);
    }

    .pool-avatar {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
      object-position: top center;
      background: #ead8c3;
    }

    .pool-name {
      font-weight: 900;
      line-height: 1.2;
    }

    .pool-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .skill-modal {
      z-index: 30;
    }

    .skill-panel {
      width: min(620px, 100%);
      max-height: min(720px, 88vh);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
      padding: 14px;
      background: #fffaf1;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .skill-detail {
      overflow: auto;
      display: grid;
      gap: 10px;
    }

    .skill-detail-meta {
      color: var(--muted);
      font-size: 13px;
    }

    .skill-detail-item {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 252, 246, .82);
    }

    .skill-detail-name {
      display: inline-block;
      margin-bottom: 6px;
      color: #71480f;
      font-weight: 900;
    }

    .skill-detail-text {
      margin: 0;
      color: #3c3028;
      font-size: 14px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    @media (min-width: 760px) {
      .app {
        padding: 26px;
      }

      .topbar {
        grid-template-columns: 1fr 360px;
      }

      .grid {
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 16px;
      }

      .pool-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="topbar" aria-labelledby="appTitle">
      <div class="title">
        <h1 id="appTitle">三国杀选将</h1>
        <p>保留斗地主环境强度前 100 左右的武将，点击一张完成选定。</p>
      </div>

      <div class="controls" aria-label="选将控制">
        <div class="control-line">
          <label class="control-label" for="cardCount">本轮候选数量</label>
          <span class="count-value" id="countValue">5</span>
        </div>
        <input id="cardCount" type="range" min="3" max="10" value="5">
        <div class="actions">
          <button class="primary" id="refreshButton" type="button">刷新武将</button>
          <button class="danger" id="forceRefreshButton" type="button">强制刷新</button>
          <button class="secondary" id="clearButton" type="button">取消选择</button>
          <button class="pool-button" id="poolButton" type="button">查看将池</button>
        </div>
        <div class="refresh-note" id="refreshNote">普通刷新后 5 分钟内会锁定结果。</div>
      </div>
    </section>

    <div class="status" aria-live="polite">
      <span id="poolStatus">将池加载中</span>
      <span class="selected-pill" id="selectedStatus">未选择</span>
    </div>

    <section class="grid" id="cardGrid" aria-label="候选武将"></section>

    <p class="source">
      武将列表整理自
      <a href="https://www.sanguosha.cn/index.php/pc/hero-list.html" target="_blank" rel="noreferrer">三国杀移动版官网武将列表页</a>，
      图片与技能文本来自对应的官网武将详情页；将池已按斗地主环境强度收缩为 110 名强将。
    </p>
  </main>

  <section class="modal" id="poolModal" aria-hidden="true" aria-labelledby="poolTitle">
    <div class="modal-panel" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="poolTitle">全武将池</h2>
        <button class="icon-button" id="closePoolButton" type="button" aria-label="关闭">×</button>
      </div>
      <div class="pool-tabs" id="poolTabs" aria-label="势力筛选"></div>
      <div class="pool-tools">
        <input class="pool-search" id="poolSearch" type="search" placeholder="搜索武将、势力或技能" autocomplete="off">
        <span class="pool-result-count" id="poolResultCount"></span>
      </div>
      <div class="pool-list" id="poolList"></div>
    </div>
  </section>

  <section class="modal skill-modal" id="skillModal" aria-hidden="true" aria-labelledby="skillTitle">
    <div class="skill-panel" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div>
          <h2 id="skillTitle">武将技能</h2>
          <div class="skill-detail-meta" id="skillMeta"></div>
        </div>
        <button class="icon-button" id="closeSkillButton" type="button" aria-label="关闭">×</button>
      </div>
      <div class="skill-detail" id="skillDetail"></div>
    </div>
  </section>

  <script src="heroes-data.js?v=20260504-official-dynamic-skins"></script>
  <script>
    const heroes = window.SANGUOSHA_HEROES || [];

    const grid = document.querySelector("#cardGrid");
    const countInput = document.querySelector("#cardCount");
    const countValue = document.querySelector("#countValue");
    const selectedStatus = document.querySelector("#selectedStatus");
    const poolStatus = document.querySelector("#poolStatus");
    const refreshButton = document.querySelector("#refreshButton");
    const forceRefreshButton = document.querySelector("#forceRefreshButton");
    const clearButton = document.querySelector("#clearButton");
    const poolButton = document.querySelector("#poolButton");
    const refreshNote = document.querySelector("#refreshNote");
    const poolModal = document.querySelector("#poolModal");
    const closePoolButton = document.querySelector("#closePoolButton");
    const poolTabs = document.querySelector("#poolTabs");
    const poolSearch = document.querySelector("#poolSearch");
    const poolResultCount = document.querySelector("#poolResultCount");
    const poolList = document.querySelector("#poolList");
    const skillModal = document.querySelector("#skillModal");
    const closeSkillButton = document.querySelector("#closeSkillButton");
    const skillTitle = document.querySelector("#skillTitle");
    const skillMeta = document.querySelector("#skillMeta");
    const skillDetail = document.querySelector("#skillDetail");

    const STATE_KEY = "sanguosha-selector-state-v2";
    const LOCK_MS = 5 * 60 * 1000;

    let currentHeroes = [];
    let selectedId = null;
    let refreshTimer = null;
    let poolFilter = "全";
    let rerolledSlots = new Set();
    let skinIndexes = {};

    poolStatus.textContent = `将池 ${heroes.length} 名`;

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(STATE_KEY) || "{}");
      } catch {
        return {};
      }
    }

    function saveState(patch = {}) {
      const next = {
        ...loadState(),
        heroIds: currentHeroes.map(hero => hero.id),
        selectedId,
        count: Number(countInput.value),
        rerolledSlots: [...rerolledSlots],
        skinIndexes,
        ...patch
      };
      localStorage.setItem(STATE_KEY, JSON.stringify(next));
      updateRefreshState();
    }

    function heroesFromIds(ids) {
      if (!Array.isArray(ids)) return [];
      const byId = new Map(heroes.map(hero => [hero.id, hero]));
      return ids.map(id => byId.get(id)).filter(Boolean);
    }

    function formatRemaining(ms) {
      const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      return `${minutes}:${seconds}`;
    }

    function updateRefreshState() {
      const state = loadState();
      const now = Date.now();
      const remaining = Math.max(0, Number(state.lockUntil || 0) - now);
      const forceCount = now - Number(state.forceWindowStart || 0) < LOCK_MS ? Number(state.forceCount || 0) : 0;

      refreshButton.disabled = remaining > 0;
      refreshButton.textContent = remaining > 0 ? `刷新锁定 ${formatRemaining(remaining)}` : "刷新武将";
      refreshNote.textContent = remaining > 0
        ? `当前结果已锁定，刷新浏览器仍会保留。5 分钟内强制刷新 ${forceCount} 次。`
        : `普通刷新后 5 分钟内会锁定结果。当前 5 分钟内强制刷新 ${forceCount} 次。`;

      clearTimeout(refreshTimer);
      if (remaining > 0) {
        refreshTimer = setTimeout(updateRefreshState, 1000);
      }
    }

    function shufflePool() {
      return [...heroes].sort(() => crypto.getRandomValues(new Uint32Array(1))[0] / 2 ** 32 - .5);
    }

    function drawHeroes({ force = false } = {}) {
      const state = loadState();
      const now = Date.now();
      if (!force && Number(state.lockUntil || 0) > now && state.heroIds?.length) {
        currentHeroes = heroesFromIds(state.heroIds);
        selectedId = Number(state.selectedId) || null;
        rerolledSlots = new Set(Array.isArray(state.rerolledSlots) ? state.rerolledSlots.map(Number) : []);
        skinIndexes = state.skinIndexes && typeof state.skinIndexes === "object" ? state.skinIndexes : {};
        render();
        updateRefreshState();
        return;
      }

      selectedId = null;
      selectedStatus.textContent = "未选择";
      currentHeroes = shufflePool().slice(0, Number(countInput.value));
      rerolledSlots = new Set();
      const forceWindowStart = now - Number(state.forceWindowStart || 0) < LOCK_MS ? Number(state.forceWindowStart) : now;
      const forceCount = force
        ? (now - Number(state.forceWindowStart || 0) < LOCK_MS ? Number(state.forceCount || 0) + 1 : 1)
        : (now - Number(state.forceWindowStart || 0) < LOCK_MS ? Number(state.forceCount || 0) : 0);
      saveState({
        lockUntil: now + LOCK_MS,
        forceWindowStart,
        forceCount,
        rerolledSlots: []
      });
      render();
    }

    function rerollHero(slotIndex) {
      if (rerolledSlots.has(slotIndex) || !currentHeroes[slotIndex]) return;

      const currentIds = new Set(currentHeroes.map(hero => hero.id));
      const replacement = heroes
        .filter(hero => !currentIds.has(hero.id))
        .sort(() => crypto.getRandomValues(new Uint32Array(1))[0] / 2 ** 32 - .5)[0];
      if (!replacement) return;

      if (selectedId === currentHeroes[slotIndex].id) {
        selectedId = null;
        selectedStatus.textContent = "未选择";
      }

      currentHeroes[slotIndex] = replacement;
      rerolledSlots.add(slotIndex);
      saveState();
      render();
    }

    function selectHero(heroId) {
      selectedId = heroId;
      const hero = heroes.find(item => item.id === heroId);
      if (hero && skinIndexes[hero.id] === undefined) {
        skinIndexes = { ...skinIndexes, [hero.id]: 0 };
      }
      selectedStatus.textContent = hero ? `已选择：${hero.name}` : "未选择";
      saveState();
      render();
    }

    function clearSelection() {
      selectedId = null;
      selectedStatus.textContent = "未选择";
      saveState();
      render();
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function formatHeroHp(hero) {
      if (!hero.hp) return "体力未标注";

      const hp = String(hero.hp);
      const hpMax = hero.hpMax ? String(hero.hpMax) : hp;
      const armor = Number(hero.armor || 0);
      const parts = hpMax !== hp
        ? [`初始体力${hp}`, `体力上限${hpMax}`]
        : [`${hp}体力`];

      if (armor > 0) {
        parts.push(`${hero.armor}护甲`);
      }

      return parts.join(" · ");
    }

    function randomItem(items) {
      if (!items.length) return "";
      const index = crypto.getRandomValues(new Uint32Array(1))[0] % items.length;
      return items[index];
    }

    function getHeroImages(hero) {
      return Array.isArray(hero.images) && hero.images.length ? hero.images : [hero.image].filter(Boolean);
    }

    function getHeroImage(hero) {
      const images = getHeroImages(hero);
      const skinIndex = skinIndexes[hero.id];
      if (skinIndex !== undefined) {
        return images[Number(skinIndex) % images.length] || images[0] || "";
      }
      return randomItem(images);
    }

    function nextHeroSkin(heroId) {
      const hero = heroes.find(item => item.id === heroId);
      const images = hero ? getHeroImages(hero) : [];
      if (images.length < 2) return;

      const nextIndex = (Number(skinIndexes[heroId] || 0) + 1) % images.length;
      skinIndexes = { ...skinIndexes, [heroId]: nextIndex };
      saveState();
      render();
    }

    function render() {
      const visibleHeroes = currentHeroes
        .map((hero, index) => ({ hero, index }))
        .filter(({ hero }) => !selectedId || hero.id === selectedId);

      grid.innerHTML = visibleHeroes.map(({ hero, index }) => {
        const isSelected = hero.id === selectedId;
        const isRerolled = rerolledSlots.has(index);
        const hasMultipleSkins = getHeroImages(hero).length > 1;
        const skills = hero.skills.map(([name, text]) => `
          <div class="skill">
            <span class="skill-name">${escapeHtml(name)}</span>
            <p class="skill-text">${escapeHtml(text)}</p>
          </div>
        `).join("");
        const name = escapeHtml(hero.name);
        const faction = escapeHtml(hero.faction);
        const image = encodeURI(getHeroImage(hero));
        const factionClass = escapeHtml(hero.factionClass);
        const hpText = escapeHtml(formatHeroHp(hero));

        return `
          <article class="card ${isSelected ? "selected" : ""}">
            <div class="portrait">
              <div class="fallback">${name}</div>
              <img src="${image}" alt="${name}武将图" loading="lazy" onerror="this.style.display='none'">
              <span class="faction ${factionClass}">${faction}</span>
              <span class="picked-mark">已选定</span>
            </div>
            <div class="body">
              <div class="name-row">
                <h2 class="name">${name}</h2>
                <span class="meta">${faction}势力 · ${hpText}</span>
              </div>
              <div class="skills">${skills}</div>
            </div>
            ${isSelected && hasMultipleSkins ? `<button class="skin-button" type="button" data-skin-id="${hero.id}">切换皮肤</button>` : ""}
            ${!isSelected ? `<button class="reroll-button" type="button" data-reroll-index="${index}" ${isRerolled ? "disabled" : ""}>${isRerolled ? "已刷新" : "单独刷新"}</button>` : ""}
            <button class="pick-button" type="button" data-id="${hero.id}">${isSelected ? "当前选择" : "选定此将"}</button>
          </article>
        `;
      }).join("");
    }

    function getSearchText(hero) {
      return [
        hero.name,
        hero.faction,
        hero.hp,
        hero.hpMax,
        hero.armor,
        hero.intro,
        ...hero.skills.flat()
      ].join(" ").toLowerCase();
    }

    function renderPool(filter = poolFilter) {
      poolFilter = filter;
      const query = poolSearch.value.trim().toLowerCase();
      const factions = ["全", ...[...new Set(heroes.map(hero => hero.faction))]];
      poolTabs.innerHTML = factions.map(faction => `
        <button class="pool-tab ${faction === filter ? "active" : ""}" type="button" data-faction="${escapeHtml(faction)}">
          ${escapeHtml(faction)}
        </button>
      `).join("");

      const byFaction = filter === "全" ? heroes : heroes.filter(hero => hero.faction === filter);
      const shown = query ? byFaction.filter(hero => getSearchText(hero).includes(query)) : byFaction;
      poolResultCount.textContent = `${shown.length}/${byFaction.length} 名`;

      if (!shown.length) {
        poolList.innerHTML = `<div class="pool-empty">没有匹配的武将</div>`;
        return;
      }

      poolList.innerHTML = shown.map(hero => {
        const name = escapeHtml(hero.name);
        const faction = escapeHtml(hero.faction);
        const hpText = escapeHtml(formatHeroHp(hero));
        return `
          <button class="pool-item" type="button" data-hero-id="${hero.id}">
            <img class="pool-avatar" src="${encodeURI(hero.thumb || getHeroImage(hero))}" alt="${name}头像" loading="lazy">
            <div>
              <div class="pool-name">${name}</div>
              <div class="pool-meta">${faction}势力 · ${hpText} · 点击查看技能</div>
            </div>
            <span class="faction ${escapeHtml(hero.factionClass)}">${faction}</span>
          </button>
        `;
      }).join("");
    }

    function openPool() {
      renderPool(poolFilter);
      poolModal.classList.add("open");
      poolModal.setAttribute("aria-hidden", "false");
      poolSearch.focus();
    }

    function closePool() {
      poolModal.classList.remove("open");
      poolModal.setAttribute("aria-hidden", "true");
    }

    function openSkill(heroId) {
      const hero = heroes.find(item => item.id === heroId);
      if (!hero) return;
      skillTitle.textContent = hero.name;
      skillMeta.textContent = `${hero.faction}势力 · ${formatHeroHp(hero)}`;
      skillDetail.innerHTML = hero.skills.map(([skillName, skillText]) => `
        <div class="skill-detail-item">
          <span class="skill-detail-name">${escapeHtml(skillName)}</span>
          <p class="skill-detail-text">${escapeHtml(skillText)}</p>
        </div>
      `).join("");
      skillModal.classList.add("open");
      skillModal.setAttribute("aria-hidden", "false");
    }

    function closeSkill() {
      skillModal.classList.remove("open");
      skillModal.setAttribute("aria-hidden", "true");
    }

    countInput.addEventListener("input", () => {
      countValue.textContent = countInput.value;
    });

    countInput.addEventListener("change", () => saveState({ count: Number(countInput.value) }));
    refreshButton.addEventListener("click", () => drawHeroes());
    forceRefreshButton.addEventListener("click", () => drawHeroes({ force: true }));
    clearButton.addEventListener("click", clearSelection);
    poolButton.addEventListener("click", openPool);
    closePoolButton.addEventListener("click", closePool);

    poolModal.addEventListener("click", event => {
      if (event.target === poolModal) closePool();
    });

    poolTabs.addEventListener("click", event => {
      const button = event.target.closest("[data-faction]");
      if (!button) return;
      renderPool(button.dataset.faction);
    });

    poolSearch.addEventListener("input", () => renderPool(poolFilter));

    poolList.addEventListener("click", event => {
      const button = event.target.closest("[data-hero-id]");
      if (!button) return;
      openSkill(Number(button.dataset.heroId));
    });

    closeSkillButton.addEventListener("click", closeSkill);

    skillModal.addEventListener("click", event => {
      if (event.target === skillModal) closeSkill();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeSkill();
        closePool();
      }
    });

    grid.addEventListener("click", event => {
      const skinButton = event.target.closest("[data-skin-id]");
      if (skinButton) {
        nextHeroSkin(Number(skinButton.dataset.skinId));
        return;
      }

      const rerollButton = event.target.closest("[data-reroll-index]");
      if (rerollButton) {
        rerollHero(Number(rerollButton.dataset.rerollIndex));
        return;
      }

      const button = event.target.closest("[data-id]");
      if (!button) return;
      selectHero(Number(button.dataset.id));
    });

    function init() {
      const state = loadState();
      if (state.count) {
        countInput.value = state.count;
        countValue.textContent = state.count;
      }
      currentHeroes = heroesFromIds(state.heroIds);
      selectedId = Number(state.selectedId) || null;
      rerolledSlots = new Set(Array.isArray(state.rerolledSlots) ? state.rerolledSlots.map(Number) : []);
      skinIndexes = state.skinIndexes && typeof state.skinIndexes === "object" ? state.skinIndexes : {};
      if (!currentHeroes.length) {
        currentHeroes = shufflePool().slice(0, Number(countInput.value));
        rerolledSlots = new Set();
        saveState({ lockUntil: 0, forceWindowStart: Date.now(), forceCount: 0 });
      }
      const hero = heroes.find(item => item.id === selectedId);
      selectedStatus.textContent = hero ? `已选择：${hero.name}` : "未选择";
      render();
      updateRefreshState();
    }

    init();
  </script>
</body>
</html>
